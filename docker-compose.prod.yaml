services:
  db:
    restart: always
    image: apache/age:latest
    container_name: imdb-age-db
    env_file:
      - .prod.env
    environment:
      # Pull from .prod.env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile.prod
    container_name: imdb-graph-backend
    environment:
      NODE_ENV: production
    restart: always
    volumes:
      - ./data:/app/data
    env_file:
      - .prod.env
    depends_on:
      db:
        condition: service_healthy
    # default so it can reach `db` (now off caddy_net -- see db's comment
    # history / homelab-infra CLAUDE.md collision note); caddy_net so
    # homelab-infra's Caddy can reverse-proxy to it by container name.
    networks:
      - default
      - caddy_net

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile.prod
    container_name: imdb-graph-frontend
    restart: always
    networks:
      - caddy_net

networks:
  default: {}
  caddy_net:
    external: true
